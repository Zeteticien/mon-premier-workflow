name: Update commit badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count commits
        id: count
        run: echo "commits=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update badge file
        run: |
          mkdir -p badges
          cat > badges/badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "commits",
            "message": "${{ steps.count.outputs.commits }}",
            "color": "blue"
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/badge.json
          git commit -m "Update commit badge [skip ci]" || exit 0
          git push
name: Installer les outils

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  installer-dependances:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Vérifier les installations
        run: |
          echo "Version de Node.js :"
          node -v
          echo "Version de Python :"
          python --version
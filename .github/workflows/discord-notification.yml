name: Discord Notification

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact image-generee
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts

      - name: Get image name
        id: image
        run: |
          IMAGE_NAME=$(ls ./artifacts | head -n 1)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build image URL
        run: |
          IMAGE_URL="https://ton-domaine-ou-pages.github.io/ton-repo/artifacts/$IMAGE_NAME"
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"📝 Commit: $COMMIT_MESSAGE\n📷 Image: $IMAGE_URL\"}" \
            $DISCORD_WEBHOOK_URL
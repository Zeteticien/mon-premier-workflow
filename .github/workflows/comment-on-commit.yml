name: Comment on Commit with Image

on:
  push:
    branches:
      - main

jobs:
  comment-on-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts

      - name: Get image filename
        id: image_file
        run: |
          IMAGE_FILE=$(ls ./artifacts | head -n 1)
          echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV

      - name: Build image URL
        run: |
          IMAGE_URL="https://github.com/${{ github.repository }}/blob/main/images/${IMAGE_FILE}?raw=true"
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Comment on commit
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commitSha = context.sha;
            const message = `✅ Commit traité avec succès.

            **Message du commit**: ${context.payload.head_commit.message}

            **Image générée**:
            ![](${process.env.IMAGE_URL})`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: message
            });
on:
    push:
        branches:
            - main
    workflow_dispatch:
 
# 🏗️ Définition des tâches (jobs)
jobs:
    secure-api-call:
        runs-on: ubuntu-latest  # Exécute sur une machine Linux GitHub
        steps:
            - name: 📥 Cloner le dépôt
              uses: actions/checkout@v4  # Récupère le code source du projet
 
            - name: 🔐 Utiliser une clé API sécurisée
              env:
                API_KEY: ${{ secrets.API_KEY }}
              run: |
                echo "La clé API est bien définie"
                echo "Longueur de la clé : ${#API_KEY}"
              # Ne jamais afficher la valeur brute du secret dans les logs